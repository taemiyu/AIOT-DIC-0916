<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Aurora Glow -->
    <radialGradient id="auroraGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Face Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="100" cy="100" r="96" fill="url(#avatarBg)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8" />
  <circle cx="100" cy="100" r="96" fill="url(#auroraGlow)" />

  <!-- Body / Hoodie -->
  <path d="M 40 185 C 40 145, 65 130, 100 130 C 135 130, 160 145, 160 185 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Hoodie Collar / V-neck -->
  <path d="M 82 132 L 100 155 L 118 132 Z" fill="#0f172a" />
  <path d="M 94 135 L 94 165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 106 135 L 106 165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Neck -->
  <rect x="90" y="112" width="20" height="24" rx="4" fill="#fdba74" />

  <!-- Head Base -->
  <ellipse cx="100" cy="85" rx="36" ry="42" fill="url(#skinGrad)" />

  <!-- Cute Sleeping / Chill Eyes (Happy closed curves ^ ^) -->
  <path d="M 80 84 Q 88 77 96 84" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <path d="M 104 84 Q 112 77 120 84" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Cheeks Blush -->
  <ellipse cx="76" cy="92" rx="7" ry="4" fill="#f43f5e" opacity="0.35" />
  <ellipse cx="124" cy="92" rx="7" ry="4" fill="#f43f5e" opacity="0.35" />

  <!-- Gentle Smile -->
  <path d="M 94 98 Q 100 104 106 98" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sleek Hair -->
  <path d="M 64 80 C 62 55, 78 40, 100 40 C 122 40, 138 55, 136 80 C 130 65, 118 55, 100 55 C 82 55, 70 65, 64 80 Z" fill="url(#hairGrad)" />
  <path d="M 64 78 C 68 85, 72 70, 78 72 C 84 74, 90 62, 100 62 C 112 62, 122 72, 136 78 C 138 65, 130 46, 100 46 C 70 46, 64 65, 64 78 Z" fill="#090d16" />

  <!-- Sleeping "Zzz" Floating Icons -->
  <g opacity="0.9">
    <text x="135" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#38bdf8">z</text>
    <text x="146" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#818cf8">z</text>
    <text x="160" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#c084fc">Z</text>
  </g>
</svg>
